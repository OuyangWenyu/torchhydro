site_name: torchhydro

site_url: https://OuyangWenyu.github.io/torchhydro

repo_url: https://github.com/OuyangWenyu/torchhydro

theme:
    palette:
        scheme: preference
    name: material
    icon:
        repo: fontawesome/brands/github
    features:
        - navigation.instant
        - search.highlight
        # - navigation.expand
        # - navigation.tabs
    custom_dir: "docs/overrides"

plugins:
    - search
    - mkdocstrings
    - git-revision-date
    - mkdocs-jupyter:
          include_source: True
        #   ignore_h1_titles: True
        #   execute: True
        #   execute_ignore: "*.ipynb"
    - include-markdown

markdown_extensions:
    - attr_list
    - pymdownx.superfences
    - pymdownx.highlight:
          linenums: true
    - toc:
          permalink: true

# extra:
#     analytics:
#         provider: google
#         property: UA-XXXXXXXXX-X

nav:
    - Home: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Examples & Results:
          - LSTM on CAMELS-US: examples/lstm_camels_results.md
          - Songliao Flood Models: examples/songliao_flood_guide.md
          - Sanxia Multi-Site: examples/sanxia_guide.md
          - MoE / Diffusion / FNO: examples/moe_diffusion_fno_guide.md
          - Seq2Seq / BALSTM / MTSLSTM: examples/seq2seq_balstm_mtslstm_guide.md
    - Advanced Topics:
          - Cloud-Zarr Joint Training: advanced/cloud_zarr_lazy_loading.md
          - Lightning Fabric: advanced/fabric_debug_guide.md
          - ERA5-Land & GPM: advanced/era5land_gpm_guide.md
          - Model Interpretability: advanced/model_interpretability.md
    - Contributing: contributing.md
    - FAQ: faq.md
    - Changelog: changelog.md
    - Report Issues: https://github.com/OuyangWenyu/torchhydro/issues
    - API Reference:
          - Overview: torchhydro.md
          - Models: api/models.md
          - Datasets: api/datasets.md
          - Trainers: api/trainers.md
          - Configs: api/configs.md
          - Explainers: api/explainers.md
